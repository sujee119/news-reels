name: Poll approvals

# Telegram inline buttons need something to read the callback. A webhook
# would need a public HTTPS endpoint, so instead this polls getUpdates on
# a schedule -- no server, no extra hosting.
#
# Five minutes is GitHub's minimum cron interval, and scheduled runs can be
# delayed under load, so treat "a few minutes after tapping" as normal.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install requests

      - name: Process button presses
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python run.py poll

      - name: Commit state
        run: |
          git config user.name  "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "process approvals"
          git pull --rebase --autostash || true
          git push || true
