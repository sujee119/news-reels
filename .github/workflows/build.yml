name: Build reel

# Daily build. The reel is NOT posted here -- it is uploaded as a release
# asset (which gives Instagram a public URL to fetch later) and sent to
# Telegram for approval. The poll workflow does the posting.
on:
  schedule:
    # Times are UTC; Asia/Seoul is +9. Three builds a day by default.
    - cron: "47 22 * * *"      # 07:47 Seoul
    - cron: "47  4 * * *"      # 13:47 Seoul
    - cron: "47 10 * * *"      # 19:47 Seoul
  workflow_dispatch:
    inputs:
      story_url:
        description: "Build one specific article (optional)"
        required: false
        type: string
      count:
        description: "How many reels to build this run"
        required: false
        default: "1"
        type: string

permissions:
  contents: write              # release upload + committing state back

concurrency:
  group: reel-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build the reel
        env:
          SCRIPT_PROVIDER: ${{ vars.SCRIPT_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
          VIDEO_PRESET: medium
        run: |
          if [ -n "${{ inputs.story_url }}" ]; then
            python run.py build --story "${{ inputs.story_url }}"
          else
            python run.py build --count "${{ inputs.count || vars.REELS_PER_RUN || 1 }}"
          fi

      - name: Publish videos and send for approval
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SLUGS=$(python run.py pending-slugs)
          if [ -z "$SLUGS" ]; then
            echo "nothing built this run"
            exit 0
          fi
          for SLUG in $SLUGS; do
            echo "::group::$SLUG"
            gh release create "reel-$SLUG" "out/$SLUG/reel.mp4" \
              --title "reel-$SLUG" --notes "auto-generated, pending approval" \
              || gh release upload "reel-$SLUG" "out/$SLUG/reel.mp4" --clobber
            URL=$(gh release view "reel-$SLUG" --json assets --jq '.assets[0].url')
            python run.py set-video-url "$SLUG" "$URL"
            python run.py notify "$SLUG"
            echo "::endgroup::"
          done

      - name: Commit state
        if: always()
        run: |
          git config user.name  "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "build $(date -u +%F)"
          git pull --rebase --autostash || true
          git push
